[project]
name = "erp"
version = "0.1.0"
requires-python = ">=3.10,<3.14"  # DeepFace/TensorFlow supports up to Python 3.13
dependencies = [
    "fastapi[standard]>=0.124.4",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.14",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "opencv-python>=4.9.0",
    "opencv-contrib-python>=4.9.0",
    "numpy>=1.26.0",
    "deepface>=0.0.96",
    "tf-keras>=2.20.1",
    "pyjwt>=2.10.1",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "onnx>=1.20.0",
    "onnxscript>=0.5.7",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "faker>=33.0.0",
    "factory-boy>=3.3.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require database)",
    "slow: Slow tests (skip with -m 'not slow')",
]

[tool.coverage.run]
source = ["server"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
