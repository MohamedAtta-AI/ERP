[project]
name = "erp"
version = "0.1.0"
requires-python = ">=3.10,<3.14"  # DeepFace/TensorFlow supports up to Python 3.13
dependencies = [
    "fastapi[standard]>=0.124.4",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "opencv-python>=4.9.0",
    "opencv-contrib-python>=4.9.0",
    "numpy>=1.26.0",
    "deepface>=0.0.96",
    "tf-keras>=2.20.1",
    "torch>=2.9.1",
]

[project.optional-dependencies]
dev = [
    "onnx>=1.20.0",
    "onnxscript>=0.5.7",
    "torch>=2.9.1",
]
